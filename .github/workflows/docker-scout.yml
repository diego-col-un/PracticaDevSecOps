name: Docker Scout Security Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # REEMPLAZA ESTO: Tu usuario de GitHub en minúsculas (ej. ghcr.io/juanperez/scout-demo)
  IMAGE_NAME: ghcr.io/diego-col-un/practicaDevSecOps

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write # Permite a Scout comentar en los Pull Requests si fuera necesario

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          # Guardamos el resultado en el caché local del runner para que Scout lo analice de inmediato
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load image into local Docker daemon
        run: |
          docker load --input /tmp/image.tar

      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: quickview
          image: ${{ env.IMAGE_NAME }}:latest
          # Este token permite que el runner se autentique temporalmente en Scout Hub de forma gratuita
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
