name: Docker Scout Security Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- AQUÍ HACEMOS TODO DINÁMICO Y EN MINÚSCULAS ---
      # github.repository ya incluye "usuario/PracticaDevSecOps".
      # Lo pasamos por 'tr' para aplanar todo a minúsculas de un solo golpe.
      - name: Set Image Name to Lowercase
        id: string
        run: |
          echo "IMAGE_NAME=ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load image into local Docker daemon
        run: |
          docker load --input /tmp/image.tar

      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: quickview
          image: ${{ env.IMAGE_NAME }}:latest
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
